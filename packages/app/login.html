<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login - Woodworking Hub</title>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
  </head>
  <body class="page">
    <mu-auth provides="wood:auth">
      <main class="card">
        <h2>User Login</h2>
        <login-form api="/auth/login" redirect="/app">
          <label>
            Username:
            <input name="username" />
          </label>
          <label>
            Password:
            <input type="password" name="password" />
          </label>
        </login-form>
        <p>Or <a href="/register.html">sign up</a></p>
      </main>
    </mu-auth>

    <script type="module">
      import { define, Auth } from "@calpoly/mustang";
      import { LoginFormElement } from "/src/auth/login-form.ts";

      define({
        "mu-auth": Auth.Provider,
        "login-form": LoginFormElement
      });
    </script>
  </body>
</html>
