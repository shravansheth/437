<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login - Woodworking Hub</title>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <script type="module">
      import { define, Auth } from "@calpoly/mustang";
      import { LoginFormElement } from "/src/auth/login-form.ts";

      define({
        "mu-auth": Auth.Provider,
        "login-form": LoginFormElement
      });
    </script>
  </head>
  <body class="page">
    <mu-auth provides="wood:auth">
      <main class="card">
        <h2>User Login</h2>
        <login-form api="/auth/login" redirect="/app">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
          <!-- Optional: Add your own submit button or rely on default slot -->
        </login-form>
        <p>Or <a href="/newuser.html">sign up as a new user</a>.</p>
      </main>
    </mu-auth>
  </body>
</html>
